<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&family=Chakra+Petch:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<title>הטיול של מעין · לברוח מהם</title>
<meta name="theme-color" content="#05080f">
<meta name="description" content="משחק ריצה: מעין בורח מבואנוס איירס דרך אושוואיה עד הקרנבל בריו. מי רודף אחריו?">
</head>
<body>
<main class="game-main">
  <div>
    <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>חזרה לדף הראשי</a>
    <h1 class="page-h">לברוח מהם</h1>
    <p class="sub">החליקו לצדדים, למעלה לקפוץ, למטה להתכופף. שלושה שלבים: בואנוס איירס, אושוואיה, ריו.</p>
  </div>

  <fieldset class="chasers" id="chasers">
    <legend class="sr">מי רודף אחרי מעין?</legend>
  </fieldset>

  <section class="punch game" aria-labelledby="game-h">
    <h2 id="game-h" class="sr">המשחק</h2>
    <div class="g-score g-score-3">
      <div><span class="lbl">מטרים</span><span class="dot" id="score">0</span></div>
      <div><span class="lbl">אמפנדות</span><span class="dot" id="coins">0</span></div>
      <div><span class="lbl">שיא</span><span class="dot" id="best">0</span></div>
    </div>
    <div class="g-stage">
      <canvas id="cv" aria-label="משחק ריצה: מעין בורח ברחובות דרום אמריקה"></canvas>
      <button class="g-mute" id="mute" type="button" aria-pressed="false" aria-label="השתקה"></button>
      <button class="g-over" id="over" type="button">
        <span class="g-stamp" id="over-t">בואו נברח</span>
        <span class="g-hint" id="over-s">לחצו כדי להתחיל</span>
      </button>
    </div>
  </section>
</main>

<script>
/* Endless runner through three stages of the trip, seen from behind Maayan.
   World units: x across the road (lanes at -100/0/100), z away from the camera, h up from the road.
   Everything is canvas shapes; the only image is Maayan's face. */
const W = 360, H = 540, HZ = 200, GY = 455, F = 320, LW = 100, ROAD = 165, WALK = 225, ZMAX = 2600, LEVEL_M = 600;
const cv = document.getElementById("cv"), ctx = cv.getContext("2d");
const $ = id => document.getElementById(id);
const face = new Image(); face.src = "face.jpg";
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

/* ---------- the three stages ---------- */
const WORLDS = [
  { name: "בואנוס איירס", sky: ["#3d97e3", "#cfe9fb"], fog: "207,233,251", road: "#3b3f4a", walk: "#c9c3b6", line: "rgba(255,255,255,.8)",
    facades: ["#e63946", "#f4a261", "#2a9d8f", "#e9c46a", "#457b9d", "#8e7dff", "#ff7aa2", "#3fb37f"], trim: "#f7f4ec", shutter: "#1b6b4a",
    kit: "arg", weather: null },
  { name: "אושוואיה", sky: ["#6d7f99", "#dfe6ee"], fog: "223,230,238", road: "#8b95a3", walk: "#f2f5f8", line: "rgba(255,255,255,.9)",
    facades: ["#b8322f", "#2f5f8f", "#d9a43b", "#3d7a58", "#7a4b2f", "#c4573a"], trim: "#ffffff", shutter: "#3a2a22",
    kit: "jacket", weather: "snow" },
  { name: "ריו · קרנבל", sky: ["#0b0630", "#4a1a6b"], fog: "74,26,107", road: "#2a2335", walk: "#efe9dc", line: "rgba(255,210,63,.85)",
    facades: ["#ff2e88", "#00c2a8", "#ffb000", "#7c4dff", "#ff5a36", "#18a0fb"], trim: "#ffd23f", shutter: "#2a1140",
    kit: "bra", weather: "confetti", night: true }
];

const CHASERS = {
  cop:  { name: "שוטר קולומביאני", say: ["¡Alto ahí!", "¡Pare, mijo!", "¡Documentos!"], caught: "השוטר תפס אותך", draw: drawCop },
  chola:{ name: "צ'ולה מתאבקת", say: ["¡Vení acá!", "¡Te agarro, gringo!", "¡A la lona!"], caught: "הצ'ולה הפילה אותך לזירה", draw: drawChola },
  ima:  { name: "אמא פולנייה", say: ["תלבש סוודר!", "לפחות תתקשר!", "אכלת משהו?"], caught: "אמא תפסה אותך. לובשים סוודר", draw: drawIma }
};
let who = "cop"; try { const v = localStorage.getItem("maayan-run-chaser"); if (CHASERS[v]) who = v; } catch(e) {}
$("chasers").insertAdjacentHTML("beforeend", Object.entries(CHASERS).map(([k, c]) =>
  `<label class="chip"><input type="radio" name="chaser" value="${k}" ${k === who ? "checked" : ""}><span>${c.name}</span></label>`).join(""));
$("chasers").addEventListener("change", e => { who = e.target.value; try { localStorage.setItem("maayan-run-chaser", who); } catch(e) {} if (mode === "idle" || mode === "over") draw(); });

let best = 0; try { best = +localStorage.getItem("maayan-run-best") || 0; } catch(e) {}
$("best").textContent = best;

/* ---------- sound: tiny synth, starts on the first tap ---------- */
let ac = null, muted = false; try { muted = localStorage.getItem("maayan-run-mute") === "1"; } catch(e) {}
const muteIcon = () => { $("mute").innerHTML = muted
  ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>'
  : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 8.5a5 5 0 0 1 0 7M19.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
  $("mute").setAttribute("aria-pressed", muted); };
muteIcon();
$("mute").addEventListener("click", () => { muted = !muted; muteIcon(); try { localStorage.setItem("maayan-run-mute", muted ? "1" : "0"); } catch(e) {} });
function tone(f, d = .1, type = "square", vol = .06, f2 = null, when = 0){
  if (muted || !ac) return;
  const t = ac.currentTime + when, o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + .02);
}
const SFX = {
  coin: () => { tone(988, .06, "square", .035); tone(1319, .09, "square", .035, null, .05); },
  jump: () => tone(300, .16, "triangle", .08, 720),
  duck: () => tone(420, .14, "triangle", .06, 160),
  lane: () => tone(600, .05, "sine", .03, 500),
  hit:  () => { tone(180, .25, "sawtooth", .08, 60); tone(90, .3, "square", .05, 40); },
  power:() => [523, 659, 784, 1047].forEach((f, i) => tone(f, .09, "square", .04, null, i * .06)),
  level:() => [392, 523, 659, 784, 659, 784].forEach((f, i) => tone(f, .12, "triangle", .07, null, i * .09)),
  over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, .18, "triangle", .07, null, i * .14)),
  tick: () => tone(660, .08, "sine", .06),
  go:   () => tone(990, .2, "sine", .07)
};

/* ---------- projection ---------- */
const S = z => F / (F + z);
const PX = (z, x) => W/2 + x * S(z);
const PY = (z, h = 0) => HZ + (GY - HZ) * S(z) - h * S(z);

/* ---------- state ---------- */
const me = { lane: 0, x: 0, h: 0, vh: 0, slide: 0, run: 0, prevLane: 0, sq: 0, tilt: 0 };
let objs = [], parts = [], dist = 0, speed = 9, coins = 0, nextRow = 0, chase = 1, stumble = 0, slow = 0;
let mode = "idle", modeT = 0, last = 0, flash = 0, shake = 0, sayIdx = 0, sayT = 0;
let level = 0, lap = 0, banner = 0, fade = 0, fromWorld = 0, magnet = 0, shield = 0, weatherT = 0;
const world = () => WORLDS[level % 3];

function reset(){
  Object.assign(me, { lane: 0, x: 0, h: 0, vh: 0, slide: 0, run: 0, prevLane: 0, sq: 0, tilt: 0 });
  objs = []; parts = []; dist = 0; speed = 9; coins = 0; nextRow = 900; chase = 1; stumble = 0; slow = 0;
  flash = 0; shake = 0; sayT = 0; level = 0; lap = 0; banner = 0; fade = 0; fromWorld = 0; magnet = 0; shield = 0;
  $("score").textContent = 0; $("coins").textContent = 0;
}
function start(){
  if (!ac){ try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} }
  ac?.resume?.();
  reset(); mode = "count"; modeT = 180; $over.hidden = true; last = performance.now(); SFX.tick(); requestAnimationFrame(loop);
}
const $over = $("over");
function caught(){ mode = "caught"; modeT = 50; shake = 14; flash = 1; SFX.hit(); burst(PX(0, me.x), GY - 70, 18, ["#ffd23f", "#fff", "#ff6384"], 6); }
function end(){
  mode = "over"; chase = 1;
  const m = Math.floor(dist / 40);
  if (m > best){ best = m; $("best").textContent = best; try { localStorage.setItem("maayan-run-best", best); } catch(e) {} }
  $("over-t").textContent = CHASERS[who].caught;
  $("over-s").textContent = `${m} מטרים · ${coins} אמפנדות · הגעת ל${world().name}` + (m > 0 && m === best ? " · שיא חדש!" : "") + " · לחצו לעוד ריצה";
  SFX.over(); draw(); $over.hidden = false; setTimeout(() => $over.focus(), 0);
}

/* ---------- spawning: every row leaves at least one lane you can get through ---------- */
function row(){
  const free = pick([-1, 0, 1]), lv = level;
  for (const lane of [-1, 0, 1]){
    if (lane === free){
      const r = Math.random();
      if (r < .09 && !magnet) objs.push({ t: "mate", lane, z: ZMAX + 120, len: 10, h: 40 });
      else if (r < .15 && !shield) objs.push({ t: "shield", lane, z: ZMAX + 120, len: 10, h: 40 });
      else if (r < .75) for (let i = 0; i < 6; i++) objs.push({ t: "coin", lane, z: ZMAX + i * 65, len: 10, h: 30 });
      continue;
    }
    const r = Math.random();
    const t = r < .22 - lv * .03 ? null : r < .5 ? "low" : r < .72 ? "high" : "big";
    if (!t) continue;
    objs.push({ t, lane, z: ZMAX, len: t === "big" ? 380 : 26, seed: Math.random() });
    /* an arc of empanadas over a jump */
    if (t === "low" && Math.random() < .45)
      for (let i = -2; i <= 2; i++) objs.push({ t: "coin", lane, z: ZMAX + i * 55, len: 10, h: 30 + (1 - (i/2.6)**2) * 75 });
  }
  nextRow = Math.max(330, 470 - lv * 35) + Math.random() * 260;
}

function hit(o){
  o.hit = true;
  if (shield > 0){ shield = 0; flash = .5; shake = 6; SFX.power(); burst(PX(0, me.x), GY - 70, 16, ["#49e6ff", "#fff"], 5); if (o.t === "big" && o.z < -6) me.lane = me.prevLane; return; }
  if (o.t === "big" && o.z > -6) return caught();       /* straight into the front of it */
  if (o.t === "big") me.lane = me.prevLane;             /* bumped its side: bounce back */
  if (stumble > 0) return caught();
  stumble = 330; slow = 45; flash = .7; shake = 8; SFX.hit(); nextSay();
  burst(PX(0, me.x), GY - 60, 10, ["#fff", "#ffd23f"], 4);
}
const nextSay = () => { sayIdx = (sayIdx + 1) % 3; sayT = 120; };

/* ---------- particles (screen space) ---------- */
function burst(x, y, n, cols, sp, g = .25){ for (let i = 0; i < n; i++){ const a = Math.random() * 6.283, v = Math.random() * sp;
  parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - sp * .4, g, life: 1, d: rnd(.02, .04), c: pick(cols), s: rnd(2, 4.5) }); } }
function weather(dt){
  const w = world().weather; if (!w) return;
  weatherT += dt;
  const rate = w === "snow" ? 1.6 : 1.1;
  while (weatherT > 1 / rate){ weatherT -= 1 / rate;
    if (w === "snow") parts.push({ x: rnd(-20, W + 20), y: -8, vx: rnd(-.6, .2), vy: rnd(1, 2.2), g: 0, life: 1, d: .0035, c: "#fff", s: rnd(1.5, 3.5), round: 1, wob: rnd(0, 6) });
    else parts.push({ x: rnd(0, W), y: -8, vx: rnd(-.8, .8), vy: rnd(1.4, 2.6), g: 0, life: 1, d: .004, c: pick(["#ff2e88", "#ffd23f", "#00c2a8", "#7c4dff", "#fff"]), s: rnd(3, 5), spin: rnd(0, 6), conf: 1 });
  }
}

/* ---------- the step ---------- */
function step(dt){
  const lvNow = Math.floor(dist / 40 / LEVEL_M);
  if (lvNow !== level){ fromWorld = level % 3; level = lvNow; lap = Math.floor(level / 3); fade = 1; banner = 170; SFX.level(); objs = objs.filter(o => o.z < 900); }
  speed = 9 + level * 1.3 + Math.min(4, (dist / 40 % LEVEL_M) / 200);
  const v = speed * (slow > 0 ? .55 : 1) * dt;
  dist += v; slow = Math.max(0, slow - dt);
  $("score").textContent = Math.floor(dist / 40);

  const px = me.x; me.x += (me.lane * LW - me.x) * Math.min(1, .3 * dt);
  me.tilt += (((me.x - px) / Math.max(dt, .01)) * .03 - me.tilt) * Math.min(1, .3 * dt);
  if (me.h > 0 || me.vh > 0){
    me.vh -= 1.05 * dt; me.h = Math.max(0, me.h + me.vh * dt);
    if (me.h === 0){ me.vh = 0; me.sq = 1; burst(PX(0, me.x), GY, 8, [world().walk, "#ffffff"], 2.2, .1); }
  }
  me.sq = Math.max(0, me.sq - .08 * dt);
  me.slide = Math.max(0, me.slide - dt); me.run += v * .045;
  if (me.h === 0 && Math.random() < .12 * dt) parts.push({ x: PX(0, me.x) + rnd(-10, 10), y: GY - 2, vx: rnd(-.5, .5), vy: rnd(-.8, -.2), g: 0, life: .6, d: .03, c: "rgba(255,255,255,.6)", s: rnd(2, 4), round: 1 });

  nextRow -= v; if (nextRow <= 0) row();
  magnet = Math.max(0, magnet - dt);
  for (const o of objs){
    o.z -= v;
    if (o.hit) continue;
    if (magnet > 0 && o.t === "coin" && o.z < 520 && o.z > -20){ o.mx = (o.mx ?? o.lane * LW) + (me.x - (o.mx ?? o.lane * LW)) * .25 * dt; o.h += (me.h + 40 - o.h) * .2 * dt; o.z -= v * .6; }
    const ox = o.mx ?? o.lane * LW;
    if (o.z > 14 || o.z + o.len < -14 || Math.abs(me.x - ox) > 52) continue;
    if (o.t === "coin"){ if (Math.abs(me.h + 40 - o.h) < 60 || magnet > 0){ o.hit = true; coins++; $("coins").textContent = coins; SFX.coin(); burst(PX(0, ox), PY(0, o.h), 6, ["#ffd23f", "#fff3b0"], 3, .05); } continue; }
    if (o.t === "mate"){ o.hit = true; magnet = 540; SFX.power(); burst(PX(0, ox), PY(0, 40), 14, ["#3df5a6", "#fff"], 4); continue; }
    if (o.t === "shield"){ o.hit = true; shield = 1; SFX.power(); burst(PX(0, ox), PY(0, 40), 14, ["#49e6ff", "#fff"], 4); continue; }
    if (o.t === "low" && me.h > 38) continue;
    if (o.t === "high" && me.slide > 0) continue;
    hit(o); if (mode !== "run") return;
  }
  objs = objs.filter(o => o.z + o.len > -200 && !(o.hit && (o.t === "coin" || o.t === "mate" || o.t === "shield")));

  stumble = Math.max(0, stumble - dt);
  chase += ((stumble > 0 ? 1 : 0) - chase) * Math.min(1, (stumble > 0 ? .12 : .018) * dt);
  sayT = Math.max(0, sayT - dt);
}
function ambient(dt){
  weather(dt);
  for (const p of parts){ p.x += p.vx * dt + (p.wob != null ? Math.sin((p.y + p.wob * 40) / 30) * .4 : 0); p.y += p.vy * dt; p.vy += p.g * dt; p.life -= p.d * dt; if (p.spin != null) p.spin += .15 * dt; }
  parts = parts.filter(p => p.life > 0 && p.y < H + 10);
  flash = Math.max(0, flash - .05 * dt); shake = Math.max(0, shake - .7 * dt);
  fade = Math.max(0, fade - .012 * dt); banner = Math.max(0, banner - dt);
}

/* ---------- input ---------- */
function act(a){
  if (mode !== "run") return;
  if (a === "left" && me.lane > -1){ me.prevLane = me.lane; me.lane--; SFX.lane(); }
  if (a === "right" && me.lane < 1){ me.prevLane = me.lane; me.lane++; SFX.lane(); }
  if (a === "up" && me.h === 0){ me.vh = 15; me.slide = 0; SFX.jump(); }
  if (a === "down"){ if (!me.slide) SFX.duck(); me.slide = 38; if (me.h > 0) me.vh = Math.min(me.vh, -14); }
}
let p0 = null;
cv.addEventListener("pointerdown", e => { p0 = { x: e.clientX, y: e.clientY, done: false }; });
cv.addEventListener("pointermove", e => {
  if (!p0 || p0.done) return;
  const dx = e.clientX - p0.x, dy = e.clientY - p0.y;
  if (Math.hypot(dx, dy) < 24) return;
  p0.done = true; act(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? "left" : "right") : (dy < 0 ? "up" : "down"));
});
cv.addEventListener("pointerup", e => {
  if (p0 && !p0.done){ const r = cv.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width;
    act(fx < .33 ? "left" : fx > .67 ? "right" : "up"); }
  p0 = null;
});
document.addEventListener("keydown", e => {
  const k = { ArrowLeft: "left", a: "left", ArrowRight: "right", d: "right", ArrowUp: "up", w: "up", " ": "up", ArrowDown: "down", s: "down" }[e.key];
  if (k && mode === "run"){ e.preventDefault(); act(k); }
});
$over.addEventListener("click", start);

/* ---------- skies: one painted canvas per stage ---------- */
const skies = WORLDS.map(() => document.createElement("canvas"));
function paintSkies(){
  const d = Math.min(devicePixelRatio || 1, 2);
  WORLDS.forEach((w, i) => {
    const c = skies[i]; c.width = W * d; c.height = (HZ + 40) * d; const b = c.getContext("2d"); b.scale(d, d);
    const g = b.createLinearGradient(0, 0, 0, HZ); g.addColorStop(0, w.sky[0]); g.addColorStop(1, w.sky[1]);
    b.fillStyle = g; b.fillRect(0, 0, W, HZ + 40);
    if (i === 0){
      b.fillStyle = "rgba(255,255,255,.85)";
      [[60, 52, 1], [250, 38, .8], [310, 92, .6]].forEach(([x, y, k]) => { b.beginPath(); b.ellipse(x, y, 34*k, 11*k, 0, 0, 7); b.ellipse(x + 18*k, y - 7*k, 20*k, 10*k, 0, 0, 7); b.fill(); });
      b.fillStyle = "#ffd23f"; b.beginPath(); b.arc(W/2 + 2, 70, 22, 0, 7); b.fill();
      b.fillStyle = "#9fb7cf"; for (let k = 0; k < 18; k++){ const x = k * 22 - 10, h = 18 + (k * 37 % 5) * 9; b.fillRect(x, HZ - h, 20, h); }
      b.fillStyle = "#f4f1e8"; b.beginPath(); b.moveTo(W/2 - 7, HZ); b.lineTo(W/2 - 4, HZ - 112); b.lineTo(W/2, HZ - 122); b.lineTo(W/2 + 4, HZ - 112); b.lineTo(W/2 + 7, HZ); b.fill();
      b.fillStyle = "rgba(20,26,60,.25)"; b.fillRect(W/2 - 1, HZ - 104, 2, 4);
    }
    if (i === 1){
      /* the Martial range behind the town, with the Beagle channel at its feet */
      const peaks = [[-20, HZ], [30, HZ - 70], [70, HZ - 40], [120, HZ - 105], [165, HZ - 60], [205, HZ - 90], [250, HZ - 50], [300, HZ - 115], [345, HZ - 55], [390, HZ]];
      b.fillStyle = "#5a6a80"; b.beginPath(); b.moveTo(-20, HZ); peaks.forEach(p => b.lineTo(...p)); b.fill();
      b.fillStyle = "#f4f7fb";
      for (let k = 1; k < peaks.length - 1; k++){ const [x, y] = peaks[k]; if (y > HZ - 55) continue;
        b.beginPath(); b.moveTo(x, y); b.lineTo(x - 18, y + 26); b.lineTo(x - 6, y + 20); b.lineTo(x + 2, y + 28); b.lineTo(x + 18, y + 24); b.fill(); }
      b.fillStyle = "#7d97b3"; b.fillRect(0, HZ - 8, W, 8);
    }
    if (i === 2){
      for (let k = 0; k < 70; k++){ b.fillStyle = `rgba(255,255,255,${.3 + (k * 13 % 7) / 10})`; b.fillRect((k * 97) % W, (k * 53) % (HZ - 40), 1.5, 1.5); }
      b.fillStyle = "#fff5d6"; b.beginPath(); b.arc(70, 60, 16, 0, 7); b.fill();
      b.fillStyle = "#0b0630"; b.beginPath(); b.arc(77, 55, 14, 0, 7); b.fill();
      /* Corcovado hill with the statue, lit */
      b.fillStyle = "#1b0d3a"; b.beginPath(); b.moveTo(110, HZ); b.bezierCurveTo(150, HZ - 40, 165, HZ - 92, 182, HZ - 94); b.bezierCurveTo(200, HZ - 92, 215, HZ - 40, 260, HZ); b.fill();

    limb(-8, -44, -11 - lL * 4, -24 - lL * 10, -10, -6 - lL * 18, k.legs, 9);
    limb(8, -44, 11 + lR * 4, -24 - lR * 10, 10, -6 - lR * 18, k.legs, 9);
    ctx.fillStyle = "#141a3c"; ctx.beginPath(); ctx.ellipse(-10, -3 - lL * 18, 8, 5 - lL * 1.5, 0, 0, 7); ctx.ellipse(10, -3 - lR * 18, 8, 5 - lR * 1.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = "#f2f2f2"; ctx.fillRect(-16, -2 - lL * 18, 12, 2); ctx.fillRect(4, -2 - lR * 18, 12, 2);
  } else {
    limb(-8, -26, -18, -14, -24, -3, k.legs, 9); limb(8, -26, 18, -14, 24, -3, k.legs, 9);
    ctx.fillStyle = "#141a3c"; ctx.beginPath(); ctx.ellipse(-26, -2, 8, 4, 0, 0, 7); ctx.ellipse(26, -2, 8, 4, 0, 0, 7); ctx.fill();
  }
  const bodyTop = sl ? -64 : -102;
  ctx.fillStyle = k.shorts; ctx.beginPath(); ctx.roundRect(-19, sl ? -36 : -56, 38, 18, 4); ctx.fill();
  const sh = sl ? 30 : 52, sy0 = bodyTop + 12;
  ctx.save(); ctx.beginPath(); ctx.roundRect(-22, sy0, 44, sh, 9); ctx.clip(); k.shirt(ctx, -22, sy0, 44, sh);
  ctx.fillStyle = "rgba(0,0,0,.12)"; ctx.fillRect(10, sy0, 12, sh); ctx.restore();
  if (k.num){ ctx.fillStyle = k.num; ctx.font = `700 ${sl ? 14 : 18}px "Chakra Petch", monospace`; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("10", 0, sy0 + sh/2 + 2); }
  /* arms with elbows, swinging against the legs; up in the air on a jump */
  const sw = runP ? Math.sin(t) : .3;
  if (air){ limb(-20, sy0 + 6, -34, sy0 - 8, -38, sy0 - 26, k.arm, 7); limb(20, sy0 + 6, 34, sy0 - 8, 38, sy0 - 26, k.arm, 7); }
  else { limb(-20, sy0 + 6, -30, sy0 + 20 - sw * 6, -26, sy0 + 32 - sw * 14, k.arm, 7); limb(20, sy0 + 6, 30, sy0 + 20 + sw * 6, 26, sy0 + 32 + sw * 14, k.arm, 7); }
  ctx.restore();
  /* the real face: he keeps looking back at whoever is chasing him */
  const hx = x + me.tilt * -6, hy = foot + (bodyTop - 10) * sy + bob, r = 25;
  ctx.save(); ctx.beginPath(); ctx.arc(hx, hy, r, 0, 7); ctx.fillStyle = "#3e4670"; ctx.fill(); ctx.clip();
  if (face.complete && face.naturalWidth){ const kk = r * 2.2 / face.naturalWidth; ctx.drawImage(face, hx - face.naturalWidth * kk / 2, hy - face.naturalHeight * kk / 2, face.naturalWidth * kk, face.naturalHeight * kk); }
  ctx.restore();
  ctx.lineWidth = 3; ctx.strokeStyle = magnet > 0 ? "#3df5a6" : "#fff"; ctx.beginPath(); ctx.arc(hx, hy, r, 0, 7); ctx.stroke();
  if (world().kit === "jacket"){ /* beanie */
    ctx.fillStyle = "#2c4a66"; ctx.beginPath(); ctx.arc(hx, hy - 6, r + 1, Math.PI * 1.08, Math.PI * 1.92); ctx.fill();
    ctx.fillStyle = "#d8f04a"; ctx.beginPath(); ctx.arc(hx, hy - r - 4, 5, 0, 7); ctx.fill();
  }
}

/* ---------- chasers, seen from behind ---------- */
function legs(c, swing, col, shoe){
  const a = Math.max(0, swing), b = Math.max(0, -swing);
  c.strokeStyle = col; c.lineWidth = 10; c.lineCap = "round"; c.lineJoin = "round";
  c.beginPath(); c.moveTo(-9, -40); c.lineTo(-12, -22 - a * 8); c.lineTo(-11, -6 - a * 14); c.moveTo(9, -40); c.lineTo(12, -22 - b * 8); c.lineTo(11, -6 - b * 14); c.stroke();
  c.fillStyle = shoe; c.beginPath(); c.ellipse(-11, -3 - a * 14, 9, 5, 0, 0, 7); c.ellipse(11, -3 - b * 14, 9, 5, 0, 0, 7); c.fill();
}
function arms(c, y, swing, col, upL, upR){
  c.strokeStyle = col; c.lineWidth = 8; c.lineCap = "round";
  c.beginPath(); c.moveTo(-22, y); c.lineTo(-34, upL ? y - 26 - swing * 4 : y + 22 - swing * 10);
  c.moveTo(22, y); c.lineTo(34, upR ? y - 26 + swing * 4 : y + 22 + swing * 10); c.stroke();
}
function drawCop(c, sw){
  legs(c, sw, "#2f4a2c", "#111");
  arms(c, -88, sw, "#2f4a2c", false, true);
  c.fillStyle = "#2f4a2c"; c.beginPath(); c.roundRect(-24, -100, 48, 64, 9); c.fill();
  c.fillStyle = "#c6f43b"; c.beginPath(); c.roundRect(-22, -96, 44, 48, 7); c.fill();
  c.fillStyle = "#c0c4c8"; c.fillRect(-22, -70, 44, 5);
  c.fillStyle = "#1e2d1b"; c.font = '800 10px Rubik, sans-serif'; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("POLICÍA", 0, -84);
  c.fillStyle = "#6b4a32"; c.beginPath(); c.arc(0, -114, 17, 0, 7); c.fill();
  c.fillStyle = "#2f4a2c"; c.beginPath(); c.ellipse(0, -124, 19, 10, 0, Math.PI, 0); c.fill(); c.fillRect(-19, -126, 38, 5);
  c.fillStyle = "#ffd23f"; c.beginPath(); c.arc(34, -116 + sw * 4, 4, 0, 7); c.fill();
}
function drawChola(c, sw){
  c.fillStyle = "#3a2a22"; c.fillRect(-12, -16 - Math.max(0, sw) * 6, 8, 14); c.fillRect(4, -16 - Math.max(0, -sw) * 6, 8, 14);
  [["#e0307a", 0], ["#8e3fd6", -14], ["#ff7aa2", -28]].forEach(([col, dy]) => { c.fillStyle = col; c.beginPath(); c.moveTo(-34 - sw * 4, -10 + dy); c.quadraticCurveTo(0, -2 + dy, 34 + sw * 4, -10 + dy); c.lineTo(16, -58); c.lineTo(-16, -58); c.fill(); });
  arms(c, -82, sw, "#a86e4a", true, true);
  c.fillStyle = "#1b9a59"; c.beginPath(); c.roundRect(-24, -98, 48, 44, 10); c.fill();
  ["#ffd23f", "#e63946", "#49e6ff"].forEach((col, i) => { c.fillStyle = col; c.fillRect(-24, -88 + i * 11, 48, 4); });
  c.fillStyle = "#141414"; c.beginPath(); c.arc(0, -112, 17, 0, 7); c.fill();
  [-8, 8].forEach(bx => { c.strokeStyle = "#141414"; c.lineWidth = 6; c.beginPath(); c.moveTo(bx, -104); c.quadraticCurveTo(bx + sw * 6, -78, bx + sw * 3, -52); c.stroke();
    c.fillStyle = "#e63946"; c.beginPath(); c.arc(bx + sw * 3, -50, 4, 0, 7); c.fill(); });
  c.fillStyle = "#4a3426"; c.beginPath(); c.ellipse(0, -126, 18, 4, 0, 0, 7); c.fill();
  c.beginPath(); c.ellipse(0, -132, 10, 10, 0, Math.PI, 0); c.fill(); c.fillRect(-10, -133, 20, 6);
}
function drawIma(c, sw){
  legs(c, sw * .8, "#d9b08c", "#6b3a5a");
  c.fillStyle = "#5b5f8a"; c.beginPath(); c.moveTo(-24, -24); c.lineTo(24, -24); c.lineTo(20, -64); c.lineTo(-20, -64); c.fill();
  arms(c, -86, sw, "#a04a8c", false, true);
  c.fillStyle = "#a04a8c"; c.beginPath(); c.roundRect(-23, -100, 46, 42, 10); c.fill();
  c.strokeStyle = "#7a3168"; c.lineWidth = 2; c.beginPath(); c.moveTo(0, -98); c.lineTo(0, -60); c.stroke();
  c.fillStyle = "#8a5a2b"; c.beginPath(); c.roundRect(-38, -66 + sw * 4, 16, 14, 3); c.fill();
  c.strokeStyle = "#8a5a2b"; c.lineWidth = 2; c.beginPath(); c.arc(-30, -66 + sw * 4, 6, Math.PI, 0); c.stroke();
  c.fillStyle = "#b9b9c2"; c.beginPath(); c.arc(0, -114, 17, 0, 7); c.fill(); c.beginPath(); c.arc(0, -132, 8, 0, 7); c.fill();
  c.save(); c.translate(38, -114); c.rotate(-.4 + sw * .35);
  c.fillStyle = "#e63946"; c.beginPath(); c.roundRect(-4, -26, 30, 24, 4); c.fill();
  c.fillRect(-12, -26, 10, 18); c.fillRect(24, -26, 10, 18);
  c.fillStyle = "#fff"; for (let i = 0; i < 3; i++) c.fillRect(0, -20 + i * 7, 22, 2);
  c.restore();
}
function drawChaser(){
  if (chase < .02) return;
  const s = 1.22, lunge = mode === "caught" ? 1 - modeT / 50 : 0;
  const side = me.x <= 0 ? 78 : -78;
  const x = PX(-40, me.x + side * (1 - lunge * .7)), y = PY(-40) + (1 - chase) * 260 - lunge * 20;
  const moving = mode === "run" || mode === "caught";
  const sw = moving ? Math.sin(me.run * 1.05 + 1) : 0, hop = mode === "run" ? Math.abs(Math.sin(me.run * 1.05)) * 5 : 0;
  ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(x, y, 30 * s, 8 * s, 0, 0, 7); ctx.fill();
  ctx.save(); ctx.translate(x, y - hop); ctx.scale(s, s); ctx.rotate(lunge * -side * .004); CHASERS[who].draw(ctx, sw); ctx.restore();
  if (sayT > 0 || !moving || chase > .85){
    const txt = CHASERS[who].say[sayIdx]; ctx.direction = /[֐-׿]/.test(txt) ? "rtl" : "ltr"; ctx.font = '800 15px Rubik, sans-serif';
    const tw = ctx.measureText(txt).width + 20, bx = Math.max(6, Math.min(W - tw - 6, x - tw/2)), by = y - 190 * s + 8;
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.roundRect(bx, by, tw, 30, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, by + 30); ctx.lineTo(x + 6, by + 30); ctx.lineTo(x, by + 40); ctx.fill();
    ctx.fillStyle = "#141a3c"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText(txt, bx + tw/2, by + 16); ctx.direction = "ltr";
  }
}

/* ---------- HUD on the canvas ---------- */
function pill(x, y, w, h, fill){ ctx.fillStyle = fill; ctx.beginPath(); ctx.roundRect(x, y, w, h, h/2); ctx.fill(); }
function hud(){
  ctx.direction = "rtl"; ctx.font = '700 13px Rubik, sans-serif'; ctx.textBaseline = "middle";
  const lbl = `שלב ${level + 1} · ${world().name}`, tw = ctx.measureText(lbl).width + 22;
  pill(W - tw - 10, 10, tw, 26, "rgba(5,8,15,.62)"); ctx.fillStyle = "#e8eeff"; ctx.textAlign = "right"; ctx.fillText(lbl, W - 21, 23.5);
  let px = 58;   /* room for the mute button at the left */
  const ring = (frac, col, icon) => {
    pill(px - 4, 8, 34, 34, "rgba(5,8,15,.62)");
    ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(px + 13, 25, 14, -Math.PI/2, -Math.PI/2 + frac * 6.283); ctx.stroke();
    icon(px + 13, 25); px += 40;
  };
  if (magnet > 0) ring(magnet / 540, "#3df5a6", (x, y) => { ctx.fillStyle = "#8a5a2b"; ctx.beginPath(); ctx.ellipse(x, y + 2, 6, 7, 0, 0, 7); ctx.fill(); ctx.strokeStyle = "#ddd"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x + 1, y - 4); ctx.lineTo(x + 5, y - 11); ctx.stroke(); });
  if (shield) ring(1, "#49e6ff", (x, y) => { ctx.fillStyle = "#e8eeff"; ctx.beginPath(); for (let i = 0; i < 10; i++){ const a = i * Math.PI / 5 - Math.PI/2, rr = i % 2 ? 3 : 7; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.fill(); });
  if (mode === "run" && stumble > 0){
    pill(W/2 - 96, 48, 192, 28, "rgba(5,8,15,.72)"); ctx.fillStyle = "#ffc857"; ctx.textAlign = "center"; ctx.fillText("זהירות, עוד מכה ונתפסת", W/2, 62.5);
  }
  if (banner > 0 && mode === "run"){
    const a = Math.min(1, banner / 25, (170 - banner) / 15), y = 150 - (1 - a) * 20;
    ctx.globalAlpha = Math.max(0, a); ctx.textAlign = "center";
    const t1 = lap > 0 && level % 3 === 0 ? `סיבוב ${lap + 1}, יותר מהר` : `שלב ${level + 1}`, t2 = world().name;
    ctx.font = '800 34px Rubik, sans-serif'; const bw = Math.max(ctx.measureText(t2).width + 50, 200);
    const g = ctx.createLinearGradient(W/2 - bw/2, 0, W/2 + bw/2, 0); g.addColorStop(0, "#8e7dff"); g.addColorStop(1, "#49e6ff");
    ctx.fillStyle = g; ctx.beginPath(); ctx.roundRect(W/2 - bw/2, y - 34, bw, 78, 16); ctx.fill();
    ctx.fillStyle = "#05080f"; ctx.font = '700 15px Rubik, sans-serif'; ctx.fillText(t1, W/2, y - 14);
    ctx.font = '800 34px Rubik, sans-serif'; ctx.fillText(t2, W/2, y + 18);
    ctx.globalAlpha = 1;
  }
  if (mode === "count"){
    const n = Math.ceil(modeT / 60), f = (modeT % 60) / 60;
    ctx.direction = "ltr"; ctx.textAlign = "center"; ctx.font = `700 ${70 + f * 40}px "Chakra Petch", monospace`; ctx.globalAlpha = .4 + f * .6;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#05080f"; ctx.lineWidth = 6;
    ctx.strokeText(n, W/2, 170); ctx.fillText(n, W/2, 170); ctx.globalAlpha = 1;
  }
  ctx.direction = "ltr";
}

/* ---------- frame ---------- */
const DRAW = { low: drawLow, high: drawHigh, big: drawBig, coin: drawCoin, mate: drawPower, shield: drawPower };
function draw(){
  ctx.save();
  if (shake > 0) ctx.translate(rnd(-shake, shake) * .6, rnd(-shake, shake) * .6);
  const w = world();
  ctx.fillStyle = w.road; ctx.fillRect(-20, HZ, W + 40, H);
  ctx.drawImage(skies[level % 3], 0, 0, W, HZ + 40);
  if (fade > 0){ ctx.globalAlpha = fade; ctx.drawImage(skies[fromWorld], 0, 0, W, HZ + 40); ctx.globalAlpha = 1; }
  scenery(w);
  const list = objs.filter(o => !(o.hit && (o.t === "coin" || o.t === "mate" || o.t === "shield"))).sort((a, b) => b.z - a.z);
  let meDrawn = false, fogged = false;
  const fog = () => { const g = ctx.createLinearGradient(0, HZ - 4, 0, HZ + 70); g.addColorStop(0, `rgba(${w.fog},.85)`); g.addColorStop(1, `rgba(${w.fog},0)`); ctx.fillStyle = g; ctx.fillRect(-20, HZ - 4, W + 40, 74); fogged = true; };
  for (const o of list){
    if (!fogged && o.z < 1300) fog();
    if (!meDrawn && o.z < 0 && o.t !== "big"){ drawMe(); meDrawn = true; }
    DRAW[o.t](o);
  }
  if (!fogged) fog();
  if (!meDrawn) drawMe();
  drawChaser();
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.4)); ctx.fillStyle = p.c;
    if (p.conf){ ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.spin); ctx.fillRect(-p.s/2, -p.s/4, p.s, p.s/2); ctx.restore(); }
    else if (p.round){ ctx.beginPath(); ctx.arc(p.x, p.y, p.s / 2, 0, 7); ctx.fill(); }
    else ctx.fillRect(p.x - p.s/2, p.y - p.s/2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  if (mode === "run" && speed > 13){ /* speed lines at the edges */
    ctx.strokeStyle = `rgba(255,255,255,${Math.min(.35, (speed - 13) * .06)})`; ctx.lineWidth = 2;
    for (let i = 0; i < 6; i++){ const a = (i * 1.7 + dist / 90) % 6.283, r0 = 230 + (i * 37 % 60);
      const cx = W/2, cy = HZ + 30, dx = Math.cos(a), dy = Math.sin(a) * .9;
      ctx.beginPath(); ctx.moveTo(cx + dx * r0, cy + dy * r0); ctx.lineTo(cx + dx * (r0 + 60), cy + dy * (r0 + 60)); ctx.stroke(); }
  }
  if (flash > 0){ ctx.fillStyle = `rgba(255,99,132,${flash * .35})`; ctx.fillRect(-20, -20, W + 40, H + 40); }
  if (magnet > 0){ const g = ctx.createRadialGradient(W/2, H/2, H * .35, W/2, H/2, H * .75); g.addColorStop(0, "rgba(61,245,166,0)"); g.addColorStop(1, "rgba(61,245,166,.18)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  ctx.restore();
  hud();
}

function loop(t){
  const dt = Math.min(2.5, (t - last) / 16.67); last = t;
  if (mode === "count"){
    const before = Math.ceil(modeT / 60); modeT -= dt; const after = Math.ceil(modeT / 60);
    if (modeT <= 0){ mode = "run"; banner = 170; SFX.go(); } else if (after !== before) SFX.tick();
  } else if (mode === "run") step(dt);
  else if (mode === "caught"){ modeT -= dt; chase = 1; if (modeT <= 0){ ambient(dt); return end(); } }
  ambient(dt); draw();
  if (mode !== "over" && mode !== "idle") requestAnimationFrame(loop);
}

function fit(){ const d = Math.min(devicePixelRatio || 1, 2); cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0); ctx.direction = "ltr"; paintSkies(); draw(); }
face.onload = draw;
document.fonts?.ready.then(() => { paintSkies(); draw(); });
addEventListener("resize", fit);
reset(); fit();
</script>
