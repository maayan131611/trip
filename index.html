<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<title>הטיול של מעין</title>
<meta name="theme-color" content="#1d3fb8">
<meta name="description" content="איפה מעין עכשיו: המסלול בדרום אמריקה">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<main>
  <div class="ticket-wrap">
  <article class="ticket" aria-labelledby="t-title">
    <div class="t-main">
      <header class="t-head">
        <h1 id="t-title">הטיול של מעין</h1>
        <span class="code dot">TLV · MAD · EZE &nbsp;07.12.26</span>
      </header>
      <div class="t-route" aria-live="polite">
        <div class="f from"><span class="lbl" id="from-l">יוצא מ</span><span class="city" id="from">…</span></div>
        <svg viewBox="0 0 34 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 10H3M11 2L3 10l8 8"/></svg>
        <div class="f to"><span class="lbl" id="to-l">אל</span><span class="city" id="to">…</span></div>
      </div>
      <dl class="t-fields" id="fields"></dl>
    </div>
    <aside class="t-stub" aria-label="פרטי הנוסע">
      <div class="photo"><img src="avatar.jpg" alt="מעין"></div>
      <dl>
        <div><dt>נוסע</dt><dd>מעין</dd></div>
        <div><dt>יעד</dt><dd>דרום אמריקה</dd></div>
      </dl>
      <p class="fine" id="bio">מעין המטורלל בדרום אמריקה. לפני שאתם שואלים: לא יודע לאן אלך, לא יודע מתי אחזור, והאמת שגם לא אכפת לי.</p>
    </aside>
    <p class="stamp" id="stamp" aria-hidden="true"></p>
  </article>
  </div>

  <section aria-labelledby="route-h">
    <h2 id="route-h">המסלול</h2>
    <ol class="stubs" id="stops"></ol>
  </section>

  <section aria-labelledby="map-h">
    <h2 id="map-h">המפה</h2>
    <div class="mapsheet">
      <div id="map" role="region" aria-label="מפת המסלול"></div>
      <p class="map-hint" id="map-hint"></p>
    </div>
  </section>

  <nav class="links" id="links" aria-label="קישורים"></nav>
  <footer id="foot"></footer>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="lb-top"><span class="lb-title" id="lb-title"></span><button id="lb-x" aria-label="סגירה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="lb-stage">
    <button id="lb-prev" aria-label="התמונה הקודמת"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <img id="lb-img" alt="">
    <button id="lb-next" aria-label="התמונה הבאה"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  </div>
  <div><p class="lb-cap" id="lb-cap"></p><p class="lb-cap lb-count" id="lb-count"></p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="trip.js"></script>
<script>
const ICONS = {
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="#1d3fb8" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="#d32638" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#d32638"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="#141a3c" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

/* ---------- Lightbox ---------- */
const lb = { el: document.getElementById("lb"), stop: null, i: 0, opener: null };
function openGallery(stopIdx, i=0){
  const s = TRIP.stops[stopIdx]; if(!s.photos?.length) return;
  lb.stop = s; lb.i = i; lb.opener = document.activeElement;
  lb.el.hidden = false; showPhoto(); document.getElementById("lb-x").focus();
}
function showPhoto(){
  const p = lb.stop.photos[lb.i], n = lb.stop.photos.length;
  document.getElementById("lb-title").textContent = lb.stop.name;
  const img = document.getElementById("lb-img"); img.src = p.src; img.alt = p.caption || lb.stop.name;
  document.getElementById("lb-cap").textContent = p.caption || "";
  document.getElementById("lb-count").textContent = `${lb.i+1} / ${n}`;
  document.getElementById("lb-prev").hidden = document.getElementById("lb-next").hidden = n < 2;
}
function step(d){ const n = lb.stop.photos.length; lb.i = (lb.i + d + n) % n; showPhoto(); }
function closeGallery(){ lb.el.hidden = true; lb.opener?.focus?.(); }
document.getElementById("lb-x").onclick = closeGallery;
document.getElementById("lb-prev").onclick = () => step(-1);
document.getElementById("lb-next").onclick = () => step(1);
lb.el.addEventListener("click", e => { if(e.target === lb.el) closeGallery(); });
document.addEventListener("keydown", e => {
  if(lb.el.hidden) return;
  if(e.key==="Escape") closeGallery();
  if(e.key==="ArrowLeft") step(1);    /* RTL: left = next */
  if(e.key==="ArrowRight") step(-1);
});
let tx=null; lb.el.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
lb.el.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) step(dx>0?1:-1); tx=null; });

/* ---------- Map ---------- */
function drawMap(){
  const el = document.getElementById("map");
  if (typeof L === "undefined"){ el.hidden = true; document.getElementById("map-hint").textContent = "המפה לא נטענה. נסו לרענן את הדף."; return; }
  const map = L.map(el, { scrollWheelZoom:false, attributionControl:true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  const pts = TRIP.stops.map(s=>[s.lat,s.lng]);
  const reached = TRIP.current==null ? 0 : TRIP.current+1;
  if (reached > 1) L.polyline(pts.slice(0,reached), { color:"#d32638", weight:4 }).addTo(map);
  const planFrom = Math.max(reached-1, 0);
  if (pts.length - planFrom > 1) L.polyline(pts.slice(planFrom), { color:"#1d3fb8", weight:3, dashArray:"6 8", opacity:.8 }).addTo(map);
  TRIP.stops.forEach((s,i)=>{
    const st = stopState(i), n = s.photos?.length || 0;
    const icon = n
      ? L.divIcon({ className:"", iconSize:[44,44], iconAnchor:[22,22],
          html:`<div class="ph-pin ${st}" style="background-image:url('${esc(s.photos[0].src)}')"><b>${n}</b></div>` })
      : L.divIcon({ className:"", iconSize:[14,14], iconAnchor:[7,7], html:`<div class="dot-pin ${st}"></div>` });
    const m = L.marker([s.lat,s.lng], { icon, title: s.name, keyboard: true }).addTo(map);
    m.bindTooltip(s.name + (st==="plan" ? " (בתכנון)" : ""), { className:"stop-tip", direction:"top", offset:[0, n?-22:-8] });
    if (n) m.on("click", () => openGallery(i));
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.25));
  const any = TRIP.stops.some(s=>s.photos?.length);
  document.getElementById("map-hint").textContent = any
    ? "לחצו על עיגול עם תמונה כדי לראות את התמונות מהמקום."
    : "כשיעלו תמונות מהדרך, כל מקום יקבל כאן עיגול עם תמונה שאפשר ללחוץ עליו.";
}

/* ---------- Ticket, route stubs, links ---------- */
const dotDate = d => { const x=new Date(d); return `${String(x.getDate()).padStart(2,"0")}.${String(x.getMonth()+1).padStart(2,"0")}`; };
const field = (dt, dd, unit="", plain=false) => `<div><dt>${dt}</dt><dd class="${plain?"txt":"dot"}">${esc(dd)}${unit?`<small>${unit}</small>`:""}</dd></div>`;
function render(){
  const now = Date.now(), dep = new Date(TRIP.departure).getTime();
  const $ = id => document.getElementById(id);
  const nextStop = TRIP.stops.find((s,i)=> i > (TRIP.current ?? -1));
  const today = new Date(now).toLocaleDateString("en-GB",{day:"2-digit",month:"2-digit",year:"2-digit"}).replace(/\//g,".");
  if (TRIP.current == null){
    const days = Math.max(0, Math.ceil((dep-now)/86400000)), first = TRIP.stops[0];
    $("from-l").textContent = "יוצא מ"; $("from").textContent = TRIP.home.name;
    $("to-l").textContent = "אל"; $("to").textContent = first.name;
    const dt = new Date(TRIP.departure);
    $("fields").innerHTML = field("יציאה", dotDate(dt), dt.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",timeZone:"Asia/Jerusalem"}))
      + field(now < dep ? "ימים ליציאה" : "סטטוס", now < dep ? nf(days) : "בטיסה", "", now >= dep)
      + field("מרחק", nf(km(TRIP.home, first)), "ק״מ");
    $("stamp").innerHTML = now < dep ? `טרם יצא<span class="dot">${today}</span>` : `בדרך<span class="dot">${today}</span>`;
  } else {
    const s = TRIP.stops[TRIP.current];
    const day = Math.floor((now-dep)/86400000)+1;
    $("from-l").textContent = "נמצא ב"; $("from").textContent = s.name;
    $("to-l").textContent = nextStop ? "הבא" : "הבא: עוד לא החליט"; $("to").textContent = nextStop ? nextStop.name : "?";
    $("fields").innerHTML = field("יום בטיול", nf(day))
      + field("מהבית", nf(km(TRIP.home,s)), "ק״מ")
      + (TRIP.lastUpdate ? field("עודכן", ago(TRIP.lastUpdate), "", true) : field("מדינה", s.country, "", true));
    $("stamp").innerHTML = `יום ${nf(day)}<span class="dot">${today}</span>`;
  }

  const rows = [`<li class="stub done"><span class="hole"></span><span class="nm"><b>${esc(TRIP.home.name)}</b><span>${esc(TRIP.home.country)}</span></span><span class="when dot">${dotDate(TRIP.departure)}<em>נקודת יציאה</em></span></li>`]
    .concat(TRIP.stops.map((s,i)=>{
      const st = stopState(i), n = s.photos?.length || 0;
      const when = `${dotDate(s.from)}${s.to?" – "+dotDate(s.to):""}`;
      const tag = st==="now" ? "עכשיו כאן" : st==="plan" ? "בתכנון" : "";
      const attrs = n ? ` has-photos" role="button" tabindex="0" data-i="${i}" aria-label="${esc(s.name)}: ${n} תמונות` : "";
      return `<li class="stub ${st}${attrs}"><span class="hole"></span><span class="nm"><b>${esc(s.name)}</b><span data-count="${n}">${esc(s.country)}</span></span><span class="when dot">${when}${tag?`<em>${tag}</em>`:""}</span></li>`;
    }));
  const box = $("stops"); box.innerHTML = rows.join("");
  box.querySelectorAll(".has-photos").forEach(r=>{
    r.onclick = () => openGallery(+r.dataset.i);
    r.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openGallery(+r.dataset.i); } };
  });

  $("links").innerHTML = TRIP.links.map(l=>{
    const off = !l.href; const sub = off ? "בקרוב" : l.note;
    return `<a class="btn" ${off?'aria-disabled="true" role="link"':`href="${l.href}" target="_blank" rel="noopener"`}>
      <span>${ICONS[l.icon]}</span><span>${l.label}${sub?`<small>${sub}</small>`:""}</span></a>`;
  }).join("") + `<a class="btn" href="stats.html"><span>${ICONS.stats}</span><span>במספרים<small>ימים, ק״מ, טיסות ועוד</small></span></a>`;

  const far = TRIP.stops.reduce((a,s)=>Math.max(a,km(TRIP.home,s)),0);
  $("foot").textContent = `הנקודה הכי רחוקה במסלול: ${nf(far)} ק״מ מהבית`;
}
render(); drawMap(); setInterval(render, 60000);
</script>
</body>
</html>
