<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="style.css">
<title>הטיול של מעין</title>
<meta name="description" content="איפה מעין עכשיו: המסלול בדרום אמריקה">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
</head>
<body>
<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 400 520" preserveAspectRatio="xMidYMax slice">
    <polygon class="p-back" points="0,330 40,250 70,290 110,200 150,280 190,215 230,300 270,230 310,290 350,210 400,280 400,520 0,520"/>
    <polygon class="p-front" points="0,380 50,300 80,330 130,230 160,180 175,140 190,175 205,120 222,190 250,250 290,300 330,260 370,320 400,300 400,520 0,520"/>
    <polygon class="p-snow" points="160,180 175,140 190,175 183,170 176,182 168,172"/>
    <polygon class="p-snow" points="205,120 222,190 214,178 206,192 199,170 196,152"/>
    <polygon class="p-snow" points="130,230 145,205 152,225 142,220"/>
    <path class="p-shore" d="M0 470 Q100 440 200 455 T400 450 V520 H0Z"/>
  </svg>
</div>
<main>
  <div class="avatar" id="avatar"><img src="avatar.jpg" alt="מעין"></div>
  <h1>הטיול של מעין</h1>
  <p class="bio" id="bio">מעין המטורלל בדרום אמריקה. לפני שאתם שואלים: לא יודע לאן אלך, לא יודע מתי אחזור, והאמת שגם לא אכפת לי.</p>

  <section class="status" aria-live="polite">
    <span class="eyebrow" id="st-eyebrow">איפה אני עכשיו</span>
    <div class="big"><span class="dot"></span><span id="st-title">…</span></div>
    <div class="meta" id="st-meta"></div>
  </section>

  <section class="mapcard" aria-labelledby="map-h">
    <h2 id="map-h">המפה</h2>
    <div id="map" role="region" aria-label="מפת המסלול"></div>
    <p class="map-hint" id="map-hint"></p>
  </section>

  <section class="route" aria-labelledby="route-h">
    <h2 id="route-h">המסלול עד עכשיו</h2>
    <div id="stops"></div>
  </section>

  <nav class="links" id="links"></nav>
  <footer id="foot"></footer>
</main>

<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
  <div class="lb-top"><span class="lb-title" id="lb-title"></span><button class="lb-x" id="lb-x" aria-label="סגירה">✕</button></div>
  <div class="lb-stage">
    <button class="lb-nav" id="lb-prev" aria-label="התמונה הקודמת">›</button>
    <img id="lb-img" alt="">
    <button class="lb-nav" id="lb-next" aria-label="התמונה הבאה">‹</button>
  </div>
  <div><p class="lb-cap" id="lb-cap"></p><p class="lb-cap lb-count" id="lb-count"></p></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="trip.js"></script>
<script>
const ICONS = {
  map:'<svg viewBox="0 0 24 24" fill="none" stroke="#22707c" stroke-width="2" stroke-linejoin="round"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="#e8735a" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#e8735a"/></svg>',
  stats:'<svg viewBox="0 0 24 24" fill="none" stroke="#3f5463" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>'
};

/* ---------- Lightbox ---------- */
const lb = { el: document.getElementById("lb"), stop: null, i: 0, opener: null };
function openGallery(stopIdx, i=0){
  const s = TRIP.stops[stopIdx]; if(!s.photos?.length) return;
  lb.stop = s; lb.i = i; lb.opener = document.activeElement;
  lb.el.hidden = false; showPhoto(); document.getElementById("lb-x").focus();
}
function showPhoto(){
  const p = lb.stop.photos[lb.i], n = lb.stop.photos.length;
  document.getElementById("lb-title").textContent = lb.stop.name;
  const img = document.getElementById("lb-img"); img.src = p.src; img.alt = p.caption || lb.stop.name;
  document.getElementById("lb-cap").textContent = p.caption || "";
  document.getElementById("lb-count").textContent = `${lb.i+1} / ${n}`;
  document.getElementById("lb-prev").hidden = document.getElementById("lb-next").hidden = n < 2;
}
function step(d){ const n = lb.stop.photos.length; lb.i = (lb.i + d + n) % n; showPhoto(); }
function closeGallery(){ lb.el.hidden = true; lb.opener?.focus?.(); }
document.getElementById("lb-x").onclick = closeGallery;
document.getElementById("lb-prev").onclick = () => step(-1);
document.getElementById("lb-next").onclick = () => step(1);
lb.el.addEventListener("click", e => { if(e.target === lb.el) closeGallery(); });
document.addEventListener("keydown", e => {
  if(lb.el.hidden) return;
  if(e.key==="Escape") closeGallery();
  if(e.key==="ArrowLeft") step(1);    /* RTL: left = next */
  if(e.key==="ArrowRight") step(-1);
});
let tx=null; lb.el.addEventListener("touchstart",e=>tx=e.touches[0].clientX,{passive:true});
lb.el.addEventListener("touchend",e=>{ if(tx==null) return; const dx=e.changedTouches[0].clientX-tx; if(Math.abs(dx)>40) step(dx>0?1:-1); tx=null; });

/* ---------- Map ---------- */
function drawMap(){
  const el = document.getElementById("map");
  if (typeof L === "undefined"){ el.hidden = true; document.getElementById("map-hint").textContent = "המפה לא נטענה. נסו לרענן את הדף."; return; }
  const map = L.map(el, { scrollWheelZoom:false, attributionControl:true });
  L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>'
  }).addTo(map);
  const pts = TRIP.stops.map(s=>[s.lat,s.lng]);
  const reached = TRIP.current==null ? 0 : TRIP.current+1;
  if (reached > 1) L.polyline(pts.slice(0,reached), { color:"#e8735a", weight:4 }).addTo(map);
  const planFrom = Math.max(reached-1, 0);
  if (pts.length - planFrom > 1) L.polyline(pts.slice(planFrom), { color:"#3f5463", weight:3, dashArray:"6 8", opacity:.7 }).addTo(map);
  TRIP.stops.forEach((s,i)=>{
    const st = stopState(i), n = s.photos?.length || 0;
    const icon = n
      ? L.divIcon({ className:"", iconSize:[44,44], iconAnchor:[22,22],
          html:`<div class="ph-pin ${st}" style="background-image:url('${esc(s.photos[0].src)}')"><b>${n}</b></div>` })
      : L.divIcon({ className:"", iconSize:[14,14], iconAnchor:[7,7], html:`<div class="dot-pin ${st}"></div>` });
    const m = L.marker([s.lat,s.lng], { icon, title: s.name, keyboard: true }).addTo(map);
    m.bindTooltip(s.name + (st==="plan" ? " (בתכנון)" : ""), { className:"stop-tip", direction:"top", offset:[0, n?-22:-8] });
    if (n) m.on("click", () => openGallery(i));
  });
  map.fitBounds(L.latLngBounds(pts).pad(0.25));
  const any = TRIP.stops.some(s=>s.photos?.length);
  document.getElementById("map-hint").textContent = any
    ? "לחצו על עיגול עם תמונה כדי לראות את התמונות מהמקום."
    : "כשיעלו תמונות מהדרך, כל מקום יקבל כאן עיגול עם תמונה שאפשר ללחוץ עליו.";
}

/* ---------- Status, route list, links ---------- */
function render(){
  const now = Date.now(), dep = new Date(TRIP.departure).getTime();
  const t = document.getElementById("st-title"), m = document.getElementById("st-meta"), e = document.getElementById("st-eyebrow");
  const nextStop = TRIP.stops.find((s,i)=> i > (TRIP.current ?? -1));
  if (TRIP.current == null){
    const days = Math.max(0, Math.ceil((dep-now)/86400000));
    e.textContent = "לפני היציאה";
    t.textContent = now < dep ? `ממריא בעוד ${days} ימים` : "בדרך לבואנוס איירס";
    m.innerHTML = `<span>טיסה <b>תל אביב → מדריד → בואנוס איירס</b></span><span>יציאה <b>${fmtDate(TRIP.departure)}</b></span>`;
  } else {
    const s = TRIP.stops[TRIP.current];
    const day = Math.floor((now-dep)/86400000)+1;
    e.textContent = `יום ${day} בטיול`;
    t.textContent = `${s.name}, ${s.country}`;
    m.innerHTML = `<span class="data">${latLabel(s)}</span><span><b>${nf(km(TRIP.home,s))}</b> ק״מ מהבית</span>`
      + (TRIP.lastUpdate ? `<span>עודכן ${ago(TRIP.lastUpdate)}</span>` : "");
  }
  if (nextStop) m.innerHTML += `<span>הבא: <b>${esc(nextStop.name)}</b></span>`;

  const rows = [`<div class="stop done"><span class="pin"></span><span class="name">${TRIP.home.name}</span><span class="when">נקודת יציאה</span></div>`]
    .concat(TRIP.stops.map((s,i)=>{
      const st = stopState(i), n = s.photos?.length || 0;
      const when = s.plan ? `בתכנון · ${fmtDate(s.from)}` : `${fmtDate(s.from)}${s.to?"–"+fmtDate(s.to):""}`;
      const attrs = n ? ` has-photos" role="button" tabindex="0" data-i="${i}" aria-label="${esc(s.name)}: ${n} תמונות` : "";
      return `<div class="stop ${st}${attrs}"><span class="pin"></span><span class="name" data-count="${n}">${esc(s.name)}</span><span class="when">${when}</span></div>`;
    }));
  const box = document.getElementById("stops"); box.innerHTML = rows.join("");
  box.querySelectorAll(".has-photos").forEach(r=>{
    r.onclick = () => openGallery(+r.dataset.i);
    r.onkeydown = ev => { if(ev.key==="Enter"||ev.key===" "){ ev.preventDefault(); openGallery(+r.dataset.i); } };
  });

  document.getElementById("links").innerHTML = TRIP.links.map(l=>{
    const off = !l.href; const sub = off ? "בקרוב" : l.note;
    return `<a class="btn" ${off?'aria-disabled="true" role="link"':`href="${l.href}" target="_blank" rel="noopener"`}>
      <span>${ICONS[l.icon]}</span><span>${l.label}${sub?`<small>${sub}</small>`:""}</span><span></span></a>`;
  }).join("") + `<a class="btn" href="stats.html"><span>${ICONS.stats}</span><span>סטטיסטיקות<small>ימים, ק״מ, מדינות ועוד</small></span><span></span></a>`;

  const far = TRIP.stops.reduce((a,s)=>Math.max(a,km(TRIP.home,s)),0);
  document.getElementById("foot").textContent = `הנקודה הכי רחוקה במסלול: ${nf(far)} ק״מ מהבית`;
}
render(); drawMap(); setInterval(render, 60000);
</script>
</body>
</html>
