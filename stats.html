<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>*,*::before,*::after{box-sizing:border-box}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Karantina:wght@400;700&family=Rubik:wght@400;500;700&family=VT323&display=swap">
<link rel="stylesheet" href="style.css">
<title>הטיול של מעין · סטטיסטיקות</title>
<meta name="theme-color" content="#1d3fb8">
<meta name="description" content="המספרים של הטיול של מעין בדרום אמריקה">
</head>
<body>
<main>
  <div>
    <a class="back" href="./"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>חזרה לכרטיס</a>
    <h1 class="page-h">במספרים</h1>
    <p class="sub" id="sub"></p>
  </div>

  <section class="punch" aria-labelledby="trip-h">
    <h2 id="trip-h">הטיול</h2>
    <div id="grid"></div>
  </section>

  <section class="punch" aria-labelledby="punch-h">
    <h2 id="punch-h">כרטיסיית ניקובים</h2>
    <div id="counters"></div>
  </section>

  <section aria-labelledby="legs-h">
    <h2 id="legs-h">קטעי המסלול</h2>
    <ol class="stubs legs" id="legs"></ol>
  </section>
  <footer>המספרים מתעדכנים בכל פעם שהדף מתעדכן מהדרך. מרחקים בקו אוויר.</footer>
</main>

<script src="trip.js"></script>
<script>
const now = Date.now(), dep = new Date(TRIP.departure).getTime();
const v = visited();
const started = TRIP.current != null && now >= dep;
const days = started ? Math.floor((now-dep)/86400000)+1 : 0;
const path = [TRIP.home, ...v];
const legs = path.slice(1).map((s,i)=>({ from: path[i].name, to: s.name, km: km(path[i], s) }));
const totalKm = legs.reduce((a,l)=>a+l.km, 0);
const countries = new Set(v.map(s=>s.country)).size;
const photos = TRIP.stops.reduce((a,s)=>a+(s.photos?.length||0), 0);
const south = v.reduce((a,s)=> !a || s.lat < a.lat ? s : a, null);
const c = TRIP.counters;

document.getElementById("sub").textContent = started
  ? `יום ${days} בדרך. כל המספרים נכונים לעדכון האחרון מהטיול.`
  : `הספירה מתחילה בנחיתה בבואנוס איירס ב-${fmtDate("2026-12-08")}. עד אז הכול באפס, ועוד ${Math.max(0,Math.ceil((dep-now)/86400000))} ימים ליציאה.`;

const row = (l, val) => `<div class="prow"><span class="l">${esc(l)}</span><span class="v dot">${esc(val)}</span></div>`;
document.getElementById("grid").innerHTML = [
  row("ימים בדרך", nf(days)),
  row("מדינות", nf(countries)),
  row("מקומות", nf(v.length)),
  row("ק״מ בקו אוויר", nf(totalKm)),
  row(south ? `הכי דרומה: ${south.name}` : "הנקודה הכי דרומית", south ? latLabel(south) : "—"),
  row("ימים בממוצע בכל מקום", v.length ? (days / v.length).toFixed(1) : "—"),
  row("תמונות בדף", nf(photos))
].join("");

/* counters as a conductor's punch card: one punched hole per time, 20 holes a row */
const punch = (l, n) => { const cells = Math.max(10, Math.ceil(n/10)*10);
  return `<div class="prow"><span class="l">${esc(l)}</span><span class="v dot">${nf(n)}</span>
    <span class="holes" aria-hidden="true">${Array.from({length:cells},(_,i)=>`<i class="${i<n?"on":""}"></i>`).join("")}</span></div>`; };
document.getElementById("counters").innerHTML = [
  punch("טיסות", c.flights), punch("אוטובוסי לילה", c.nightBuses), punch("טרקים", c.treks),
  punch("אטרקציות אקסטרים", c.extreme), punch("הוסטלים", c.hostels)
].join("");

const first = TRIP.stops[0];
document.getElementById("legs").innerHTML = legs.length
  ? legs.map(l=>`<li class="stub done"><span class="hole"></span><span class="nm"><b>${esc(l.from)} ← ${esc(l.to)}</b></span><span class="when dot">${nf(l.km)}<em>ק״מ</em></span></li>`).join("")
  : `<li class="stub plan"><span class="hole"></span><span class="nm"><b>${esc(TRIP.home.name)} ← ${esc(first.name)}</b><span>הקטע הראשון, עוד לא יצא</span></span><span class="when dot">${nf(km(TRIP.home, first))}<em>ק״מ</em></span></li>`;
</script>
</body>
</html>
